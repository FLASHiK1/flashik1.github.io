name: Rico
options:
  bundleIdPrefix: io.github.flashik1
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
targets:
  Rico:
    type: application
    platform: iOS
    sources:
      - path: Rico
        excludes:
          - "web"
          - "web/**"
      - path: Rico/web
        type: folder
        buildPhase: resources
    dependencies:
      - framework: Frameworks/llama.xcframework
        embed: true
    info:
      path: Rico/Info.plist
      properties:
        CFBundleDisplayName: Рико
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        UIFileSharingEnabled: true
        CFBundleDocumentTypes:
          - CFBundleTypeName: GGUF Model
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes:
              - io.github.flashik1.gguf
              - public.data
        UTImportedTypeDeclarations:
          - UTTypeIdentifier: io.github.flashik1.gguf
            UTTypeDescription: GGUF Model
            UTTypeConformsTo:
              - public.data
            UTTypeTagSpecification:
              public.filename-extension:
                - gguf
        LSSupportsOpeningDocumentsInPlace: true
        UIRequiresFullScreen: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.flashik1.rico
        PRODUCT_NAME: Rico
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGNING_ALLOWED: "NO"
        CODE_SIGNING_REQUIRED: "NO"
        CODE_SIGN_IDENTITY: ""
        ENABLE_BITCODE: "NO"
        GENERATE_INFOPLIST_FILE: "NO"
